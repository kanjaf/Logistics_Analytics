version: 2

models:
  - name: stg_shipments
    description: >
      Cleaned and standardized shipment records. Exact duplicate source rows
      are removed before transformations. Text fields are trimmed, converted
      to uppercase, and blank strings are converted to NULL. Source delivery
      fields are preserved, and identified data-quality issues are exposed
      through explicit flags.

    columns:
      - name: shipment_id
        description: >
          Shipment identifier, trimmed and converted to uppercase.
          Blank values are converted to NULL.
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: >
          Customer identifier associated with the shipment, trimmed and
          converted to uppercase. Blank values are converted to NULL.
          Missing values are preserved when absent from the source.

      - name: delivery_status
        description: >
          Source delivery status, trimmed and converted to uppercase.
          Blank values are converted to NULL. The source status is preserved
          rather than recalculated from delivery dates.

      - name: is_delayed
        description: >
          Source-system indicator of whether the shipment was marked delayed.
          Preserved from the source and not recalculated in staging.

      - name: delay_flag_mismatch
        description: >
          Data-quality flag set to 1 when the source is_delayed indicator
          disagrees with the comparison of actual_delivery_date and
          expected_delivery_date. NULL when either date is missing.
          A value of 1 identifies disagreement but does not establish
          which field is correct.
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]

      - name: in_transit_with_actual_date_flag
        description: >
          Data-quality flag set to 1 when delivery_status normalizes to
          IN TRANSIT and actual_delivery_date is populated. This identifies
          a potential status/date inconsistency; it does not prove delivery.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]