version: 2

models:
  - name: stg_vehicles
    description: >
      Cleaned and standardized vehicle records. Exact duplicate source rows
      are removed before transformations. Text fields are trimmed, converted
      to uppercase, and blank strings are converted to NULL. Negative
      odometer readings are preserved and flagged for investigation.

    columns:
      - name: vehicle_id
        description: >
          Vehicle identifier, trimmed and converted to uppercase.
          Blank values are converted to NULL.
        data_tests:
          - not_null
          - unique

      - name: registration_number
        description: >
          Vehicle registration number, trimmed and converted to uppercase.
          Blank values are converted to NULL.

      - name: vehicle_type
        description: >
          Vehicle type, trimmed and converted to uppercase.
          Blank values are converted to NULL.

      - name: capacity_kg
        description: Vehicle load capacity in kilograms, cast to an integer.

      - name: fuel_type
        description: >
          Fuel type, trimmed and converted to uppercase.
          Blank values are converted to NULL.

      - name: vehicle_age_years
        description: Vehicle age in years, cast to an integer.

      - name: purchase_date
        description: Vehicle purchase date recorded in the source.

      - name: status
        description: >
          Vehicle status, trimmed and converted to uppercase.
          Blank values are converted to NULL. Missing statuses are preserved.

      - name: odometer_km
        description: >
          Odometer reading in kilometres, cast to BIGINT. Negative readings
          are preserved rather than replaced.

      - name: negative_odometer_flag
        description: >
          Data-quality flag set to 1 when odometer_km is negative,
          otherwise 0.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]